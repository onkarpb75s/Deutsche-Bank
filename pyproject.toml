[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankops-reliability-analytics"
version = "1.0.0"
description = "Synthetic banking technology service reliability analytics demo"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
bankops-report = "bankops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
